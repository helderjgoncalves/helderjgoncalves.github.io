name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # scripts/prerender.mjs derives sitemap <lastmod> and the case study's
          # dateModified from commit dates. The default shallow clone only knows
          # about the tip commit, which would date every page to this deploy.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Asserts the built pages describe their own routes before anything is
      # published — the deploy goes straight to production with no staging step.
      - name: Verify build output
        run: npm test

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Ships public/.well-known/tdmrep.json, the site-wide AI-training opt-out.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
