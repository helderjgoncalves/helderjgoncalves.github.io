<!doctype html>
<!--
  Source for public/og/cv.jpg (1200x630 social card; ?eyebrow=… sets the
  eyebrow, ?tag=… the rows under the rule). Regenerate with `npm run cards` after changing
  the copy here.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: Inter, sans-serif;
    /* Mirrors --hero-from / --hero-to so the card reads as the same surface
       as the site's hero. */
    background: linear-gradient(135deg, #2c557f 0%, #3a6ea5 100%);
    color: #fff; display: flex; align-items: center;
    padding: 0 76px; gap: 64px; overflow: hidden; position: relative;
  }
  /* A generic blurred backdrop, not a photo: soft light like the photo
     cards have, in the hero's blue, warm behind the portrait's sunset. The
     left is shaded so the text keeps its contrast. */
  .backdrop {
    position: absolute; inset: -120px; filter: blur(70px);
    background:
      radial-gradient(40% 58% at 80% 45%, rgba(255,150,84,.85), transparent 72%),
      radial-gradient(44% 58% at 12% 95%, rgba(52,176,200,.7), transparent 72%),
      radial-gradient(50% 50% at 46% 0%, rgba(124,104,220,.6), transparent 72%),
      linear-gradient(135deg, #24496f 0%, #3a6ea5 100%);
  }
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(20,30,46,.38), rgba(20,30,46,.08) 62%, transparent);
  }
  .text { flex: 1; position: relative; z-index: 1; }
  .eyebrow {
    font-size: 22px; font-weight: 600; letter-spacing: .10em;
    text-transform: uppercase; color: rgba(255,255,255,.72); margin-bottom: 26px;
  }
  h1 { font-size: 82px; font-weight: 800; letter-spacing: -.025em; line-height: 1.02; }
  .role {
    font-size: 37px; font-weight: 600; color: #cfe0f2;
    margin-top: 16px; letter-spacing: -.01em;
  }
  .rule { width: 92px; height: 5px; background: rgba(255,255,255,.55); border-radius: 3px; margin: 34px 0 26px; }
  /* Line break is explicit: keep the stack on its own row. */
  .tag { font-size: 24px; font-weight: 400; color: rgba(255,255,255,.88); line-height: 1.5; }
  .photo { position: relative; z-index: 1; flex-shrink: 0; }
  .photo img {
    width: 340px; height: 340px; border-radius: 50%; object-fit: cover;
    border: 7px solid rgba(255,255,255,.22);
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="shade"></div>
  <div class="text">
    <div class="eyebrow" id="eyebrow">hgoncalves.uk</div>
    <h1>Hélder Gonçalves</h1>
    <div class="role">Lead Software Engineer</div>
    <div class="rule"></div>
    <div class="tag" id="tag">Developer tools · Agentic AI<br/>React, TypeScript &amp; .NET</div>
  </div>
  <div class="photo"><img src="../../public/portrait.jpg" alt=""/></div>
  <script>
    const query = new URLSearchParams(location.search);
    const eyebrow = query.get('eyebrow');
    if (eyebrow) document.getElementById('eyebrow').textContent = eyebrow;
    // `tag` rows are separated by newlines.
    const tag = query.get('tag');
    if (tag) {
      const el = document.getElementById('tag');
      el.replaceChildren();
      tag.split('\n').forEach((row, i) => {
        if (i) el.append(document.createElement('br'));
        el.append(row);
      });
    }
  </script>
</body>
</html>
