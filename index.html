<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Apply persisted theme before paint. Runs synchronously here in <head>
      so the page never flashes the wrong colour scheme during hydration.
      "auto" / no preference falls through to the @media (prefers-color-scheme)
      rule in the stylesheet.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* localStorage may be unavailable */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a6ea5" />

    <!--
      Fonts are requested here rather than via @import in main.scss. An @import
      is only discovered *after* the stylesheet itself has downloaded and
      parsed, which pushes the font two hops down the critical path and delays
      first text paint. Declaring the link here lets the preload scanner start
      both connections while the HTML is still streaming.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="canonical" href="https://hgoncalves.uk/" />
    <meta name="description" content="Lead Software Engineer on developer tools at OutSystems. Curriculum vitae, a home-lab case study, and photos from 26 countries of travel." />
    <meta name="author" content="Hélder Gonçalves" />
    <!--
      Opt in to richer Google SERP treatment: large image previews, no
      character cap on text snippets, no cap on video previews. Default
      "index, follow" is implicit but stating it explicitly is harmless.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!--
      rel="me" links are read by Google (Knowledge Graph identity verification),
      Mastodon (profile verification), and IndieWeb tooling. They assert that
      this page and the linked profiles represent the same person.
    -->
    <link rel="me" href="https://github.com/helderjgoncalves" />
    <link rel="me" href="https://www.linkedin.com/in/helderjgoncalves" />

    <!-- Open Graph (LinkedIn, Slack, Facebook, etc.) -->
    <meta property="og:site_name" content="Hélder Gonçalves" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hgoncalves.uk/" />
    <meta property="og:title" content="Hélder Gonçalves — Lead Software Engineer" />
    <meta property="og:description" content="Lead Software Engineer on developer tools at OutSystems. Curriculum vitae, a home-lab case study, and photos from 26 countries of travel." />
    <meta property="og:image" content="https://hgoncalves.uk/og-home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hélder Gonçalves — Lead Software Engineer at OutSystems" />
    <meta property="og:locale" content="en_GB" />
    <meta property="profile:first_name" content="Hélder" />
    <meta property="profile:last_name" content="Gonçalves" />
    <meta property="profile:username" content="helderjgoncalves" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hélder Gonçalves — Lead Software Engineer" />
    <meta name="twitter:description" content="Lead Software Engineer on developer tools at OutSystems. Curriculum vitae, a home-lab case study, and photos from 26 countries of travel." />
    <meta name="twitter:image" content="https://hgoncalves.uk/og-home.png" />
    <meta name="twitter:image:alt" content="Hélder Gonçalves — Lead Software Engineer at OutSystems" />

    <title>Hélder Gonçalves — Lead Software Engineer</title>

    <!--
      JSON-LD placeholder. scripts/prerender.mjs replaces this block per route:
      a WebPage on /, a ProfilePage on /cv/, a TechArticle on /homelab/.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "@id": "https://hgoncalves.uk/#webpage",
        "url": "https://hgoncalves.uk/",
        "name": "Hélder Gonçalves — Lead Software Engineer",
        "description": "Lead Software Engineer on developer tools at OutSystems. Curriculum vitae, a home-lab case study, and photos from 26 countries of travel.",
        "inLanguage": "en-GB",
        "mainEntity": {
          "@type": "Person",
          "@id": "https://hgoncalves.uk/#person",
          "name": "Hélder Gonçalves",
          "url": "https://hgoncalves.uk/cv/",
          "jobTitle": "Lead Software Engineer"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
