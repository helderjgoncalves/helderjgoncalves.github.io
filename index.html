<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!--
      Apply persisted theme before paint. Runs synchronously here in <head>
      so the page never flashes the wrong colour scheme during hydration.
      "auto" / no preference falls through to the @media (prefers-color-scheme)
      rule in the stylesheet.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* localStorage may be unavailable */ }
      })();
    </script>
    <!--
      Sections fade in on scroll (useReveal), so they start hidden — but only
      while the bundle can still reveal them. If it fails to load (a page
      cached from before a deploy names a script that no longer exists, a
      proxy blocks it) or throws, the class goes and the pre-rendered page
      simply shows.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js-reveal');
        addEventListener('error', function (e) {
          if (e instanceof ErrorEvent || (e.target && e.target.tagName === 'SCRIPT')) {
            root.classList.remove('js-reveal');
          }
        }, true);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a6ea5" />

    <!--
      Inter is served from this site, never from Google Fonts: a request there
      hands every visitor's IP address to Google, which German courts have
      ruled needs consent. Declared here rather than in main.scss so the
      preload scanner fetches the font while the HTML is still streaming,
      instead of after the stylesheet has downloaded and parsed. The latin-ext
      file loads only for a character outside latin (unicode-range).
    -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(/fonts/inter-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url(/fonts/inter-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <link rel="canonical" href="https://hgoncalves.uk/" />
    <meta name="description" content="Lead Software Engineer on developer tools at OutSystems. Curriculum vitae, a home-lab case study, and photos from travel and adventures." />
    <meta name="author" content="Hélder Gonçalves" />
    <!--
      Opt in to richer Google SERP treatment: large image previews, no
      character cap on text snippets, no cap on video previews. Default
      "index, follow" is implicit but stating it explicitly is harmless.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Text and data mining reserved (Article 4(3) of Directive (EU) 2019/790), in TDMRep's machine-readable form. -->
    <meta name="tdm-reservation" content="1" />

    <!--
      rel="me" links are read by Google (Knowledge Graph identity verification),
      Mastodon (profile verification), and IndieWeb tooling. They assert that
      this page and the linked profiles represent the same person.
    -->
    <link rel="me" href="https://github.com/helderjgoncalves" />
    <link rel="me" href="https://www.linkedin.com/in/helderjgoncalves" />

    <!-- Open Graph (LinkedIn, Slack, Facebook, etc.) -->
    <meta property="og:site_name" content="Hélder Gonçalves" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hgoncalves.uk/" />
    <meta property="og:title" content="Hélder Gonçalves — Lead Software Engineer" />
    <meta property="og:description" content="Lead Software Engineer on developer tools at OutSystems. Curriculum vitae, a home-lab case study, and photos from travel and adventures." />
    <meta property="og:image" content="https://hgoncalves.uk/og/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hélder Gonçalves — Lead Software Engineer at OutSystems" />
    <meta property="og:locale" content="en_GB" />
    <meta property="profile:first_name" content="Hélder" />
    <meta property="profile:last_name" content="Gonçalves" />
    <meta property="profile:username" content="helderjgoncalves" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hélder Gonçalves — Lead Software Engineer" />
    <meta name="twitter:description" content="Lead Software Engineer on developer tools at OutSystems. Curriculum vitae, a home-lab case study, and photos from travel and adventures." />
    <meta name="twitter:image" content="https://hgoncalves.uk/og/home.jpg" />
    <meta name="twitter:image:alt" content="Hélder Gonçalves — Lead Software Engineer at OutSystems" />

    <title>Hélder Gonçalves — Lead Software Engineer</title>

    <!--
      JSON-LD placeholder. scripts/prerender.mjs replaces this block per route:
      an ImageGallery on /, a ProfilePage on /cv/, a TechArticle on /homelab/,
      a CollectionPage on /trips/ and a TouristTrip on each trip.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "@id": "https://hgoncalves.uk/#webpage",
        "url": "https://hgoncalves.uk/",
        "name": "Hélder Gonçalves — Lead Software Engineer",
        "description": "Lead Software Engineer on developer tools at OutSystems. Curriculum vitae, a home-lab case study, and photos from travel and adventures.",
        "inLanguage": "en-GB",
        "mainEntity": {
          "@type": "Person",
          "@id": "https://hgoncalves.uk/#person",
          "name": "Hélder Gonçalves",
          "url": "https://hgoncalves.uk/cv/",
          "jobTitle": "Lead Software Engineer"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
